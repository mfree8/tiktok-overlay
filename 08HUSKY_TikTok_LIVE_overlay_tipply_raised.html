<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>08HUSKY TikTok LIVE Overlay - Tipply Raised</title>
<style>
  :root {
    --white: #ffffff;
    --muted: rgba(255,255,255,.78);
    --cyan: #25f4ee;
    --pink: #fe2c55;
    --blue: #62a9ff;
    --purple: #a56cff;
    --green: #49f49a;
    --cycle-ms: 5000;
  }

  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent !important;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  body {
    display: grid;
    place-items: center;
  }

  .overlay {
    position: relative;
    width: min(96vw, 1100px);
    height: min(38vw, 360px);
    min-height: 250px;
    max-height: 360px;
    isolation: isolate;
  }

  /* Soft glow behind the active message. Page background remains transparent. */
  .ambient {
    position: absolute;
    inset: 19% 9% 5%;
    border-radius: 50%;
    filter: blur(44px);
    opacity: .16;
    background: radial-gradient(circle at center, var(--accent, var(--blue)), transparent 67%);
    transition: background .45s ease;
    pointer-events: none;
  }

  .card {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 20px 30px 24px;
    opacity: 0;
    transform: translateY(18px) scale(.92);
    filter: blur(8px);
    pointer-events: none;
  }

  .card.active {
    animation: cardIn .62s cubic-bezier(.17,.84,.32,1.18) forwards,
               cardOut .58s ease-in calc(var(--cycle-ms) - 650ms) forwards;
  }

  @keyframes cardIn {
    0%   { opacity: 0; transform: translateY(26px) scale(.86) rotate(-2deg); filter: blur(10px); }
    55%  { opacity: 1; transform: translateY(-4px) scale(1.045) rotate(.7deg); filter: blur(0); }
    78%  { transform: translateY(1px) scale(.985) rotate(-.25deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); filter: blur(0); }
  }
  @keyframes cardOut {
    0%   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    100% { opacity: 0; transform: translateY(-18px) scale(.95); filter: blur(8px); }
  }

  .logo-wrap {
    height: 160px;
    min-height: 160px;
    width: fit-content;
    margin-inline: auto;
    display: grid;
    place-items: center;
    justify-items: center;
    filter: drop-shadow(0 9px 16px rgba(0,0,0,.42));
    animation: hover 2.8s ease-in-out infinite;
  }

  @keyframes hover {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .logo { max-width: 440px; max-height: 150px; overflow: visible; }

  .brand-stack {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    width: fit-content;
    max-width: min(92vw, 860px);
    margin-inline: auto;
  }


  .message-shell {
    position: relative;
    display: inline-flex;
    margin-top: -3px;
    justify-content: center;
    align-items: center;
    width: fit-content;
    max-width: min(92vw, 820px);
    margin-inline: auto;
    padding: 0;
    background: transparent;
    border: 0;
    box-shadow: none;
    overflow: visible;
    backdrop-filter: none;
  }

  .message-shell {
    animation: textFloat 2.8s ease-in-out infinite;
  }

  @keyframes textFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }

  .message-shell::before,
  .message-shell::after {
    content: "✦";
    position: absolute;
    color: #ffffff;
    font-size: 18px;
    text-shadow: 0 0 9px var(--accent), 0 0 18px var(--accent);
    animation: sparklePop 2.4s ease-in-out infinite;
    pointer-events: none;
  }

  .message-shell::before {
    left: -42px;
    top: -12px;
  }

  .message-shell::after {
    right: -42px;
    bottom: -8px;
    animation-delay: 1.1s;
  }

  @keyframes sparklePop {
    0%,100% { opacity: .25; transform: scale(.7) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.2) rotate(35deg); }
  }


  .message {
    position: relative;
    z-index: 2;
    display: inline-block;
    width: auto;
    margin: 0 auto;
    padding: 2px 10px 8px;
    font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
    font-weight: 950;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: .045em;
    line-height: .94;
    font-size: clamp(28px, 4.7vw, 58px);
    color: #ffffff;
    -webkit-text-stroke: 1.4px color-mix(in srgb, var(--accent) 78%, #ffffff);
    text-shadow:
      0 3px 0 rgba(0,0,0,.92),
      0 6px 10px rgba(0,0,0,.55),
      0 0 10px color-mix(in srgb, var(--accent) 72%, transparent),
      0 0 24px color-mix(in srgb, var(--accent) 48%, transparent);
    filter: drop-shadow(0 5px 10px rgba(0,0,0,.35));
    white-space: normal;
    text-wrap: balance;
    max-width: 820px;
    transform: rotate(-1deg);
  }

  .message::before,
  .message::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 20px;
    height: 4px;
    border-radius: 999px;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
    opacity: .95;
  }

  .message::before {
    left: -22px;
    transform: rotate(-24deg);
  }

  .message::after {
    right: -22px;
    transform: rotate(24deg);
  }

  .accent {
    position: relative;
    display: inline-block;
    color: var(--accent);
    -webkit-text-stroke: 1.8px #ffffff;
    text-shadow:
      0 3px 0 rgba(0,0,0,.95),
      0 0 12px var(--accent),
      0 0 28px color-mix(in srgb, var(--accent) 60%, transparent);
    transform: skewX(-7deg) rotate(.5deg);
  }

  .accent::after {
    content: "";
    position: absolute;
    left: 7%;
    right: 7%;
    bottom: -7px;
    height: 5px;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, var(--accent), #ffffff, var(--accent), transparent);
    box-shadow: 0 0 12px var(--accent);
    animation: electricLine 1.9s ease-in-out infinite;
  }

  @keyframes electricLine {
    0%,100% { opacity: .58; transform: scaleX(.86); }
    50% { opacity: 1; transform: scaleX(1.05); }
  }

  /* FORTNITE */
  .fortnite-logo {
    position: relative;
    display: inline-grid;
    place-items: center;
    overflow: visible;
  }
  .fortnite-word {
    position: relative;
    display: inline-block;
    font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
    font-size: 96px;
    line-height: .84;
    letter-spacing: -.04em;
    transform: perspective(280px) rotateX(-8deg) skewX(-9deg) rotate(-2deg);
    background: linear-gradient(135deg, #a6ffff 0%, #25f4ee 18%, #47b8ff 38%, #7f7cff 58%, #ff4fc3 78%, #fe2c55 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: 1.2px rgba(255,255,255,.78);
    text-shadow:
      0 0 8px rgba(126,252,255,.98),
      0 0 16px rgba(37,244,238,.92),
      0 0 26px rgba(71,184,255,.88),
      0 0 38px rgba(255,79,195,.78),
      0 0 52px rgba(254,44,85,.68);
    filter: drop-shadow(0 0 12px rgba(37,244,238,.60)) drop-shadow(0 0 20px rgba(255,79,195,.50));
  }
  .fortnite-word::after {
    content: "";
    position: absolute;
    left: 4%;
    right: 4%;
    top: 10%;
    height: 34%;
    background: linear-gradient(90deg, rgba(255,255,255,.55), rgba(255,255,255,.12), rgba(255,255,255,.42));
    mix-blend-mode: screen;
    opacity: .65;
    clip-path: polygon(4% 20%, 18% 4%, 28% 14%, 40% 0, 54% 18%, 68% 3%, 78% 16%, 94% 4%, 87% 44%, 12% 52%);
    pointer-events: none;
  }
  .fortnite-logo small {
    position: relative;
    z-index: 1;
    display: block;
    margin-top: 8px;
    padding: 4px 12px 5px;
    border-radius: 999px;
    font-family: Arial, sans-serif;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .34em;
    color: #172133;
    background: linear-gradient(180deg, #ffe56a 0%, #ffbe3d 100%);
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
    opacity: .98;
    -webkit-text-stroke: 0;
    text-shadow: none;
  }

  /* Heart Me emblem inspired by TikTok LIVE gift colors */
  .heartme-logo { width: 150px; height: 150px; }
  .heartme-logo .heart-main { transform-origin: center; animation: heartBeat 1.45s ease-in-out infinite; }
  .heartme-logo .wink-eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: winkEye 3.2s ease-in-out infinite;
  }
  .heartme-logo .wink-spark {
    animation: winkSpark 3.2s ease-in-out infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  @keyframes heartBeat {
    0%, 58%, 100% { transform: scale(1); }
    64% { transform: scale(1.10); }
    72% { transform: scale(.97); }
    80% { transform: scale(1.06); }
  }
  @keyframes winkEye {
    0%, 70%, 100% { transform: scaleY(1); opacity: 1; }
    74% { transform: scaleY(0.08); opacity: 1; }
    78% { transform: scaleY(1); opacity: 1; }
  }
  @keyframes winkSpark {
    0%, 70%, 100% { transform: scale(1) rotate(0deg); opacity: .95; }
    75% { transform: scale(1.22) rotate(8deg); opacity: 1; }
    79% { transform: scale(1) rotate(0deg); opacity: .95; }
  }


  /* PL + EN compact bilingual slide */
  .language-logo {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 205px;
    height: 108px;
    margin: 0 auto;
  }

  .flag-card {
    position: absolute;
    display: grid;
    place-items: center;
    background: transparent;
    border: 0;
    box-shadow: none;
    perspective: 500px;
  }

  .flag-card.pl {
    left: 18px;
    z-index: 2;
    animation: flagSwayLeft 3.6s ease-in-out infinite;
  }

  .flag-card.en {
    right: 18px;
    z-index: 1;
    animation: flagSwayRight 3.6s ease-in-out infinite .22s;
  }

  @keyframes flagSwayLeft {
    0%,100% { transform: translateY(0) rotate(-7deg); }
    50% { transform: translateY(-3px) rotate(-5deg); }
  }

  @keyframes flagSwayRight {
    0%,100% { transform: translateY(0) rotate(7deg); }
    50% { transform: translateY(-3px) rotate(5deg); }
  }

  .flag-svg {
    width: 118px;
    height: auto;
    overflow: visible;
    transform-origin: 6% 50%;
    transform-box: fill-box;
    filter:
      drop-shadow(0 7px 8px rgba(0,0,0,.45))
      drop-shadow(0 0 8px rgba(255,255,255,.14));
    animation: windWave 2.8s ease-in-out infinite;
    will-change: transform;
  }

  .flag-card.en .flag-svg {
    animation-delay: .18s;
  }

  @keyframes windWave {
    0%, 100% {
      transform: perspective(420px) rotateY(-4deg) rotateZ(-1deg) skewY(0deg) scaleX(1);
    }
    20% {
      transform: perspective(420px) rotateY(4deg) rotateZ(.5deg) skewY(-1.1deg) scaleX(.992);
    }
    45% {
      transform: perspective(420px) rotateY(-7deg) rotateZ(1deg) skewY(.9deg) scaleX(1.008);
    }
    70% {
      transform: perspective(420px) rotateY(5deg) rotateZ(-.4deg) skewY(-.6deg) scaleX(.997);
    }
  }




  .language-card .logo-wrap {
    height: 112px;
    min-height: 112px;
  }

  .language-card .brand-stack {
    gap: 1px;
  }

  .language-card .message {
    font-size: clamp(24px, 4vw, 46px);
    line-height: .92;
  }

  .language-card .message .lang-sub {
    display: inline-block;
    margin-top: 5px;
    font-family: "Arial Black", Arial, sans-serif;
    font-size: .58em;
    letter-spacing: .045em;
    color: #fff;
    -webkit-text-stroke: .6px rgba(255,255,255,.12);
    text-shadow:
      0 2px 0 rgba(0,0,0,.92),
      0 0 10px rgba(165,108,255,.75),
      0 0 18px rgba(37,244,238,.38);
    transform: none;
  }

  /* Tipply wordmark recreation for clear visibility on stream */
  .tipply-logo {
    display: flex;
    align-items: flex-start;
    gap: 0;
    color: #fff;
    font-family: Arial Black, Arial, sans-serif;
    font-size: 96px;
    font-weight: 950;
    letter-spacing: -.085em;
    line-height: .95;
  }
  .tipply-logo .ti { position: relative; }
  .tipply-logo .dot {
    position: absolute;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: #49f49a;
    top: -12px;
    left: 35px;
    box-shadow: 0 0 16px rgba(73,244,154,.8);
  }

  .tag {
    position: absolute;
    right: 4px;
    bottom: 2px;
    font-size: 10px;
    color: rgba(255,255,255,.34);
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  /* Tipply: tighter logo-to-text spacing */
  .tipply-card .message-shell {
    margin-top: -18px;
  }

  @media (max-width: 760px) {
    .overlay { width: 97vw; min-height: 220px; }
    .brand-stack { max-width: 94vw; gap: 10px; }
    .logo-wrap { height: 120px; min-height: 120px; }
    .fortnite-word { font-size: 68px; }
    .heartme-logo { width: 116px; height: 116px; }
    .tipply-logo { font-size: 70px; }
    .language-logo { width: 180px; height: 92px; }
    .flag-card.pl { left: 15px; }
    .flag-card.en { right: 15px; }
    .flag-svg { width: 104px; }
    .language-card .logo-wrap { height: 98px; min-height: 98px; }

    .message-shell { width: fit-content; max-width: 94vw; margin-inline: auto; padding: 0; }
    .message { font-size: clamp(22px, 6vw, 38px); }
    .tipply-card .message-shell { margin-top: -12px; }
  }
</style>
</head>

<script>
(() => {
  /* CHANGE THIS NUMBER to control how long each message stays on screen. */
  const DISPLAY_TIME = 5000; // milliseconds: 5000 = 5 seconds
  const cards = [...document.querySelectorAll('.card')];
  const ambient = document.getElementById('ambient');
  let current = 0;

  document.documentElement.style.setProperty('--cycle-ms', `${DISPLAY_TIME}ms`);

  function show(index) {
    cards.forEach((card, i) => {
      card.classList.remove('active');
      // Re-trigger CSS animation reliably on every cycle.
      void card.offsetWidth;
      if (i === index) card.classList.add('active');
    });
    const accent = cards[index].dataset.accent || '#62a9ff';
    ambient.style.setProperty('--accent', accent);
  }

  show(0);
  setInterval(() => {
    current = (current + 1) % cards.length;
    show(current);
  }, DISPLAY_TIME);
})();
</script>
</body>
</html>
